<div class="page-header">
    <div>
        <h1 class="page-title">Compras</h1>
        <div class="breadcrumb">Transacciones / Compras</div>
    </div>
    <button class="btn btn-primary" id="btnNuevaCompra">
        <i class="fa-solid fa-plus"></i> Nueva Compra
    </button>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Historial de Compras</h3>
        <div class="search-bar" style="width: 250px;">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInputCompra" placeholder="Buscar compra...">
        </div>
    </div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
        <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background-color: var(--bg-surface-hover);">
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ID</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">COMPROBANTE</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">TOTAL</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">CONDICIÓN PAGO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-align: right;">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaCompraBody">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 2rem;">Cargando compras...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="modalCompra" class="modal-overlay" style="display: none;">
    <div class="modal-content card" style="width: 100%; max-width: 900px; padding-bottom: 2rem;">
        <div class="card-header">
            <h3 class="card-title" id="modalTitleCompra">Nueva Compra</h3>
            <button class="icon-btn" id="btnCloseModalCompra"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="card-body">
            <form id="formCompra">
                <!-- CABECERA -->
                <h4 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Cabecera</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Proveedor *</label>
                        <select id="idProveedorCompra" class="form-control" required>
                            <option value="">Seleccione proveedor...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Almacén *</label>
                        <select id="idAlmacenCompra" class="form-control" required>
                            <option value="">Seleccione almacén...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Condición Pago *</label>
                        <select id="condicionPagoCompra" class="form-control" required>
                            <option value="CONTADO">Contado</option>
                            <option value="CREDITO">Crédito</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo Comprobante *</label>
                        <select id="idTipoComprobanteCompra" class="form-control" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo Movimiento *</label>
                        <select id="idTipoMovimientoCompra" class="form-control" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Serie *</label>
                            <input type="text" id="serieComprobanteCompra" class="form-control" required placeholder="F001" maxlength="10">
                        </div>
                        <div class="form-group" style="flex: 2;">
                            <label class="form-label">Número *</label>
                            <input type="text" id="numeroComprobanteCompra" class="form-control" required placeholder="000123" maxlength="20">
                        </div>
                    </div>
                </div>

                <!-- DETALLE -->
                <h4 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; display: flex; justify-content: space-between;">
                    Detalle de Artículos
                    <button type="button" class="btn btn-primary" id="btnAgregarFilaCompra" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">
                        <i class="fa-solid fa-plus"></i> Agregar Artículo
                    </button>
                </h4>
                
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 1rem;">
                    <thead>
                        <tr style="background-color: var(--bg-surface-hover);">
                            <th style="padding: 0.5rem; text-align: left;">Artículo</th>
                            <th style="padding: 0.5rem; text-align: right; width: 100px;">Cantidad</th>
                            <th style="padding: 0.5rem; text-align: right; width: 120px;">Costo Unit.</th>
                            <th style="padding: 0.5rem; text-align: right; width: 120px;">Subtotal</th>
                            <th style="padding: 0.5rem; text-align: center; width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="tablaDetallesCompra">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>

                <!-- TOTALES -->
                <div style="display: flex; justify-content: flex-end; margin-bottom: 2rem;">
                    <div style="width: 250px; background: var(--bg-surface-hover); padding: 1rem; border-radius: 8px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>Subtotal:</span>
                            <strong id="lblSubtotalCompra">$ 0.00</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>Impuesto (18%):</span>
                            <strong id="lblImpuestoCompra">$ 0.00</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 0.5rem;">
                            <span>Total:</span>
                            <strong id="lblTotalCompra" style="color: var(--primary-color); font-size: 1.2rem;">$ 0.00</strong>
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn btn-outline" id="btnCancelModalCompra">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardarCompra">Completar Compra</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .data-table td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
    }
    .data-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }
    
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex; justify-content: center; align-items: center;
        opacity: 0;
        animation: fadeIn 0.2s forwards;
    }
    .modal-content {
        max-height: 95vh;
        overflow-y: auto;
    }
</style>
