<div class="page-header">
    <div>
        <h1 class="page-title">Proveedores</h1>
        <div class="breadcrumb">Administración / Proveedores</div>
    </div>
    <button class="btn btn-primary" id="btnNuevoProveedor">
        <i class="fa-solid fa-plus"></i> Nuevo Proveedor
    </button>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Listado de Proveedores</h3>
        <div class="search-bar" style="width: 250px;">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInputProveedor" placeholder="Buscar proveedor...">
        </div>
    </div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
        <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background-color: var(--bg-surface-hover);">
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ID</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">RUC</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">RAZÓN SOCIAL</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">CONTACTO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ESTADO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-align: right;">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaProveedorBody">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 2rem;">Cargando proveedores...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="modalProveedor" class="modal-overlay" style="display: none;">
    <div class="modal-content card" style="width: 100%; max-width: 600px;">
        <div class="card-header">
            <h3 class="card-title" id="modalTitleProveedor">Nuevo Proveedor</h3>
            <button class="icon-btn" id="btnCloseModalProveedor"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="card-body">
            <form id="formProveedor">
                <input type="hidden" id="idProveedor">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label class="form-label">Razón Social *</label>
                        <input type="text" id="razonSocialProveedor" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tipo Documento *</label>
                        <select id="idTipoDocumentoProveedor" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">RUC / Documento *</label>
                        <input type="text" id="rucProveedor" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefonoProveedor" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="emailProveedor" class="form-control">
                    </div>

                    <div class="form-group" style="grid-column: span 2;">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccionProveedor" class="form-control">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="btnCancelModalProveedor">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardarProveedor">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .data-table td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
    }
    .data-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }
    
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex; justify-content: center; align-items: center;
        opacity: 0;
        animation: fadeIn 0.2s forwards;
    }
</style>
