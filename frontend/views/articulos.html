<div class="page-header">
    <div>
        <h1 class="page-title">Catálogo de Artículos</h1>
        <div class="breadcrumb">Catálogos / Artículos</div>
    </div>
    <button class="btn btn-primary" id="btnNuevoArticulo">
        <i class="fa-solid fa-plus"></i> Nuevo Artículo
    </button>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Listado de Artículos</h3>
        <div class="search-bar" style="width: 250px;">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInputArticulos" placeholder="Buscar artículo...">
        </div>
    </div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
        <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background-color: var(--bg-surface-hover);">
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">CÓDIGO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">DESCRIPCIÓN</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">PRECIO VENTA</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">STOCK MÍN.</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ESTADO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-align: right;">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaArticulosBody">
                <!-- Se llenará dinámicamente -->
                <tr>
                    <td colspan="6" style="text-align: center; padding: 2rem;">Cargando artículos...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para Crear/Editar Artículo -->
<div id="modalArticulo" class="modal-overlay" style="display: none;">
    <div class="modal-content card" style="width: 100%; max-width: 600px;">
        <div class="card-header">
            <h3 class="card-title" id="modalTitle">Nuevo Artículo</h3>
            <button class="icon-btn" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="card-body">
            <form id="formArticulo">
                <!-- Campo Oculto para ID (Edición) -->
                <input type="hidden" id="idArticulo">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Código del Artículo *</label>
                        <input type="text" id="codigoArticulo" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Código de Barras</label>
                        <input type="text" id="codigoBarras" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Descripción *</label>
                    <input type="text" id="descripcion" class="form-control" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Precio de Venta *</label>
                        <input type="number" id="precioVenta" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Costo de Compra *</label>
                        <input type="number" id="costoCompra" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Stock Mínimo</label>
                        <input type="number" id="stockMinimo" class="form-control" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado *</label>
                        <select id="estado" class="form-control" required>
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1rem 0;">
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Relaciones (IDs temporales)</p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Familia</label>
                        <select id="isFamilia" class="form-control" required>
                            <option value="">Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">SubFamilia</label>
                        <select id="idSubFamilia" class="form-control" required disabled>
                            <option value="">Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Unidad Medida</label>
                        <select id="idUnidadMedida" class="form-control" required>
                            <option value="">Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Marca</label>
                        <select id="idMarca" class="form-control" required>
                            <option value="">Seleccione...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">URL de Imagen</label>
                    <input type="text" id="imagenUrl" class="form-control" placeholder="https://...">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="btnCancelModal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardarArticulo">Guardar Artículo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .data-table td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
    }
    .data-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }
    .badge {
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
    }
    .badge-success { background: var(--success-light); color: var(--success); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex; justify-content: center; align-items: center;
        opacity: 0;
        animation: fadeIn 0.2s forwards;
    }
    .modal-content {
        max-height: 90vh;
        overflow-y: auto;
    }
</style>
