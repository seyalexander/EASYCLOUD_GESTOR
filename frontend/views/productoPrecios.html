<div class="page-header">
    <div>
        <h1 class="page-title">Precios por Producto</h1>
        <div class="breadcrumb">Catálogos / Precios por Producto</div>
    </div>
    <button class="btn btn-primary" id="btnNuevoProductoPrecio">
        <i class="fa-solid fa-plus"></i> Nuevo Precio
    </button>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Listado de Precios</h3>
        <div class="search-bar" style="width: 250px;">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInputProductoPrecio" placeholder="Buscar por artículo...">
        </div>
    </div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
        <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background-color: var(--bg-surface-hover);">
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ARTÍCULO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">LISTA DE PRECIO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">PRECIO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">VIGENCIA</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ESTADO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-align: right;">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaProductoPrecioBody">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 2rem;">Cargando precios...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="modalProductoPrecio" class="modal-overlay" style="display: none;">
    <div class="modal-content card" style="width: 100%; max-width: 600px;">
        <div class="card-header">
            <h3 class="card-title" id="modalTitleProductoPrecio">Nuevo Precio</h3>
            <button class="icon-btn" id="btnCloseModalProductoPrecio"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="card-body">
            <form id="formProductoPrecio">
                <input type="hidden" id="idProductoPrecio">
                
                <div class="form-group">
                    <label class="form-label">Artículo *</label>
                    <select id="idArticuloPrecio" class="form-control" required>
                        <option value="">Seleccione un artículo...</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">ID Lista Precio *</label>
                        <input type="number" id="idListaPrecio" class="form-control" required placeholder="Ej. 1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Precio *</label>
                        <input type="number" step="0.01" id="precioArticulo" class="form-control" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Fecha Inicio *</label>
                        <input type="date" id="fechaInicioPrecio" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha Fin *</label>
                        <input type="date" id="fechaFinPrecio" class="form-control" required>
                    </div>
                </div>

                <div class="form-group" id="estadoProductoPrecioGroup" style="display: none;">
                    <label class="form-label">Estado *</label>
                    <select id="estadoProductoPrecio" class="form-control" required>
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="btnCancelModalProductoPrecio">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardarProductoPrecio">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .data-table td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
    }
    .data-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }
    .badge {
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
    }
    .badge-success { background: var(--success-light); color: var(--success); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex; justify-content: center; align-items: center;
        opacity: 0;
        animation: fadeIn 0.2s forwards;
    }
    .modal-content {
        max-height: 90vh;
        overflow-y: auto;
    }
</style>
