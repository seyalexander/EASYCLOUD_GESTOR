<div class="page-header">
    <div>
        <h1 class="page-title">Almacenes</h1>
        <div class="breadcrumb">Administración / Almacenes (Inventarios)</div>
    </div>
    <button class="btn btn-primary" id="btnNuevoAlmacen">
        <i class="fa-solid fa-plus"></i> Nuevo Almacén
    </button>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Listado de Almacenes</h3>
        <div class="search-bar" style="width: 250px;">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInputAlmacen" placeholder="Buscar almacén...">
        </div>
    </div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
        <table class="data-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background-color: var(--bg-surface-hover);">
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ID</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">DESCRIPCIÓN</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">SUCURSAL (ID)</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">ESTADO</th>
                    <th style="padding: 1rem 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-align: right;">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaAlmacenBody">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 2rem;">Cargando almacenes...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="modalAlmacen" class="modal-overlay" style="display: none;">
    <div class="modal-content card" style="width: 100%; max-width: 500px;">
        <div class="card-header">
            <h3 class="card-title" id="modalTitleAlmacen">Nuevo Almacén</h3>
            <button class="icon-btn" id="btnCloseModalAlmacen"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="card-body">
            <form id="formAlmacen">
                <input type="hidden" id="idAlmacen">
                
                <div class="form-group">
                    <label class="form-label">Descripción *</label>
                    <input type="text" id="descripcionAlmacen" class="form-control" required placeholder="Ej. Almacén Central">
                </div>

                <div class="form-group">
                    <label class="form-label">ID Sucursal *</label>
                    <input type="number" id="idSucursalAlmacen" class="form-control" required value="1" min="1">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="btnCancelModalAlmacen">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardarAlmacen">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .data-table td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
    }
    .data-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }
    
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex; justify-content: center; align-items: center;
        opacity: 0;
        animation: fadeIn 0.2s forwards;
    }
</style>
